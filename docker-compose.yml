services:
  # ─── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fashion_store_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fashion_store}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fashion_864}
      POSTGRES_DB: ${POSTGRES_DB:-fashion_store}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fashion_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fashion_store}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fashion_store_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    networks:
      - fashion_network
    healthcheck:
      test: ['CMD', 'redis-cli', '--pass', '${REDIS_PASSWORD:-redis123}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── NestJS API ───────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: fashion_store_api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-fashion_store}:${POSTGRES_PASSWORD:-fashion_864}@postgres:5432/${POSTGRES_DB:-fashion_store}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6380
      JWT_SECRET: ${JWT_SECRET:-secret_dev_change_in_prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-refresh_secret_change_in_prod}
    ports:
      - '3000:3000'
      - '9229:9229'
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - fashion_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run start:dev

# ─── Volumes ──────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:

# ─── Networks ─────────────────────────────────────────────────
networks:
  fashion_network:
    driver: bridge